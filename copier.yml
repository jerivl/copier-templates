# questions
project_name:
    type: str
    help: "Name: What is the name of your project?"
    default: "new-project"
application:
    type: str
    help: "Application: Will {{project_name}} have any of the following aspects?"
    default: []
    choices:
        - writing
        - calculus
        - infrastructure
        - web-development
        - shell-scripts
        - serialized-data
    multiselect: true
languages:
    type: str
    help: "Languages: What technologies are going to be used in {{project_name}}?"
    default: []
    choices:
        - python
    multiselect: true
dbs:
    type: str
    help: "Databases: What technologies are going to be used in {{project_name}}?"
    default: []
    choices:
        - sqlite
        - duckdb
    multiselect: true
vcs:
    type: str
    help: "VCS: Will you primarily use jujutsu (jj) or git for version control?"
    default: jj
    choices:
        - jj
        - git
commit_helpers:
    type: str
    help: "Commits: Use any of the following generators for commit messages?"
    default: none
    choices:
        - none
        - cocogitto
        - cocogitto+koji
        - cocogitto+koji+aicommit2
emacs:
    type: str
    help: "Emacs: Create new local development environment"
    default: true
    choices:
        - true
        - false
literate:
    type: str
    help: "Literate: Should we create ./README.md as a literate config for {{project_name}}?"
    default: true
    choices:
        - true
        - false
